<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#09090b"><title>Historial Espejo</title><link rel="icon" href="/favicon.svg"><style>
:root{color-scheme:dark;--bg:#09090b;--surface:#121316;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.12);--text:#ededf0;--text-2:#a3a3ad;--text-3:#6f707a;--accent:#34d399;--accent-ink:#03150e;--danger:#fb8a9a;--sans:Geist,"Geist Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;background:radial-gradient(640px 360px at 50% -80px,rgba(16,185,129,.16),transparent 70%),radial-gradient(1px 1px at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0) 0 0/24px 24px,var(--bg)}
.wrap{width:100%;max-width:380px}
.card{padding:28px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--surface);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 30px 60px -20px rgba(0,0,0,.8)}
.mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(160deg,#34d399,#059669);box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 10px 24px -8px rgba(16,185,129,.7)}
h1{margin:18px 0 4px;font-size:20px;font-weight:600;letter-spacing:-.02em}
p{margin:0;color:var(--text-2);font-size:13.5px}
form{margin-top:22px}
label{display:block;margin:14px 0 6px;font-size:12.5px;font-weight:500;color:var(--text-2)}
input{width:100%;height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--line-2);background:rgba(0,0,0,.25);color:var(--text);font:inherit;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:rgba(52,211,153,.45);box-shadow:0 0 0 4px rgba(52,211,153,.1)}
button{width:100%;height:42px;margin-top:20px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.16) inset,0 10px 24px -10px rgba(16,185,129,.8)}
button:hover{background:#4ade9f}button:disabled{opacity:.6;cursor:progress}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
small{display:block;margin-top:16px;color:var(--text-3);font-size:12px;line-height:1.55}
#error{margin-top:12px;color:var(--danger);font-size:13px}#error:empty{display:none}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;color:var(--text-3);font-size:12px}
.foot i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(52,211,153,.15)}
</style><script src="/auth/login.js" defer></script></head><body><div class="wrap"><main class="card"><div class="mark"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 2.5v11M12 2.5v11M4 8h8" stroke="#03150e" stroke-width="2" stroke-linecap="round"/></svg></div><h1>Historial Espejo</h1><p id="status" role="status">Conectando este navegador…</p><form id="login" hidden><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="enter" type="submit">Entrar y mantener conectado</button><small>También puedes abrir tu enlace personal para entrar sin escribir la contraseña. Este navegador quedará conectado.</small></form><p id="error" role="alert"></p></main><div class="foot"><i></i>Tu historial, copiado en tiempo real</div></div></body></html>
