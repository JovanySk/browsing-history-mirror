<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Historial Espejo</title><link rel="icon" href="/favicon.svg"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#202124;color:#e8eaed;font:16px Arial,system-ui,sans-serif;padding:24px}.card{width:100%;max-width:400px;padding:30px;border:1px solid #3c4043;border-radius:20px;background:#292a2d}.brand{display:flex;align-items:center;gap:12px;font-size:23px}.icon{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#b4a5fa;color:#202124;font-weight:bold}p{color:#bdc1c6;line-height:1.5;font-size:14px}input,button{width:100%;font:inherit;padding:13px 16px;border-radius:12px;margin-top:12px}input{color:#e8eaed;background:#202124;border:1px solid #5f6368}button{background:#8ab4f8;color:#202124;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}label{font-size:14px}#error{color:#f28b82}small{display:block;color:#9aa0a6;line-height:1.5;margin-top:18px}
</style><script src="/auth/login.js" defer></script></head><body><main class="card"><div class="brand"><span class="icon">H</span>Historial Espejo</div><p id="status" role="status">Conectando este navegador…</p><form id="login" hidden><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="enter" type="submit">Entrar y mantener conectado</button><small>También puedes abrir tu enlace personal para entrar sin escribir la contraseña. Este navegador quedará conectado.</small></form><p id="error" role="alert"></p></main></body></html>
